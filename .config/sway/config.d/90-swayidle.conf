# Idle and lock configuration
#
# Overrides /usr/share/sway/config.d/90-swayidle.conf (same filename wins).
# Locks with gtklock (styled via ~/.config/gtklock/style.css) after 300
# seconds of inactivity, then turns off displays after another 60 seconds,
# and turns them back on when resumed. Also locks before sleep.
#
# You can also lock the screen manually by running `loginctl lock-session`
# or pressing Mod+Shift+Escape.
#
# Requires: swayidle
# Requires: gtklock
# Requires: /usr/bin/pkill, /usr/bin/pgrep

exec LT="300" ST="60" swayidle -w \
        timeout $LT 'gtklock -d' \
        timeout $((LT + ST)) 'swaymsg "output * power off"' \
             resume 'swaymsg "output * power on"'  \
        timeout $ST 'pgrep -xu "$USER" gtklock >/dev/null && swaymsg "output * power off"' \
             resume 'pgrep -xu "$USER" gtklock >/dev/null && swaymsg "output * power on"'  \
        before-sleep 'gtklock -d' \
        lock 'gtklock -d' \
        unlock 'pkill -xu "$USER" -x gtklock'

bindsym $mod+Shift+Escape exec loginctl lock-session
