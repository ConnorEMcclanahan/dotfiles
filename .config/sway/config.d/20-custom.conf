# DP-1 (144Hz) on the left, DP-2 (240Hz) on the right
output DP-1 mode 1920x1080@144.001Hz position 0,0
output DP-2 mode 1920x1080@240.001Hz position 1920,0

# Zero mouse acceleration
input "type:pointer" {
accel_profile "flat"
pointer_accel 0.0
}

# Safely override default launcher with Fuzzel
unbindsym $mod+d
bindsym $mod+d exec fuzzel

# Screenshot focused monitor: Super+P -> ~/Pictures/screenshot.png
bindsym $mod+p exec ~/.local/bin/screenshot-focused.sh

# (wallpaper handled by `output ... bg` in ~/.config/sway/config)
# (locking handled by 90-swayidle.conf)

