# DP-1 (144Hz) on the left, DP-2 (240Hz) on the right
output DP-1 mode 1920x1080@144.001Hz position 0,0
output DP-2 mode 1920x1080@240.001Hz position 1920,0

# Zero mouse acceleration
input "type:pointer" {
    accel_profile "flat"
    pointer_accel 0.0
}

# Application launcher (Fuzzel) shortcut
bindsym $mod+d exec fuzzel
